[project]
name = "chainwatch"
version = "0.1.0"
description = "AI early-warning system for supply chain disruptions on India to Europe trade lanes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "feedparser>=6.0.14",
    "networkx>=3.6.1",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "lightgbm>=4.7.0",
    "shap>=0.51.0",
    "matplotlib>=3.11.2",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "streamlit>=1.65.0",
    "pydeck>=0.9.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chainwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# The formatter owns code line length; long comments and docstrings are allowed.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query in argument defaults are the framework's documented pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
